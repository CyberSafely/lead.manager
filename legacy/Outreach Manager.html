<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Pipeline</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#5d6670;--line:#e2e5ea;--accent:#2457d6;--accent-ink:#fff;
  --ok:#1f7a4d;--warn:#a15c00;--bad:#b42318;--chip:#eef1f6;--hover:#f0f3f8;
  --s0:#9aa3ad;--s1:#5b8def;--s2:#8b6cf0;--s3:#e0a03a;--s4:#1f9d5c;--sx:#c9ced6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--panel:#1a1e24;--ink:#e6e9ee;--muted:#9aa3ad;--line:#2b3139;--accent:#6d93ff;--accent-ink:#0d1117;
    --ok:#4cc38a;--warn:#e0a03a;--bad:#ff6b5e;--chip:#252b33;--hover:#222830;
    --s0:#6b737d;--s1:#6d93ff;--s2:#a48cff;--s3:#f0b44c;--s4:#3fbf7f;--sx:#3a414a;
  }
}
:root[data-theme="dark"]{
  --bg:#111418;--panel:#1a1e24;--ink:#e6e9ee;--muted:#9aa3ad;--line:#2b3139;--accent:#6d93ff;--accent-ink:#0d1117;
  --ok:#4cc38a;--warn:#e0a03a;--bad:#ff6b5e;--chip:#252b33;--hover:#222830;
  --s0:#6b737d;--s1:#6d93ff;--s2:#a48cff;--s3:#f0b44c;--s4:#3fbf7f;--sx:#3a414a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.gs{position:relative}
.gs input{width:260px}
.gs-r{position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:360px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:10;display:none}
.gs-r.open{display:block}
.gs-r button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer;color:var(--ink)}
.gs-r button:hover,.gs-r button.sel{background:var(--line)}
.gs-r .gs-badge{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gs-r .gs-empty{padding:10px;color:var(--muted);font-size:13px}
header h1{font-size:16px;margin:0;font-weight:650}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
nav button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
main{padding:20px;max-width:1300px;margin:0 auto}
.banner{padding:8px 12px;border-radius:8px;background:var(--chip);color:var(--muted);font-size:13px;margin-bottom:14px}
.banner.warn{border-left:3px solid var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
button.b,label.b{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:6px;cursor:pointer}
button.b:hover,label.b:hover{background:var(--hover)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.d{color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .v{font-size:26px;font-weight:650}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr.click:hover td{background:var(--hover);cursor:pointer}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:12px;white-space:nowrap}
.over{color:var(--bad);font-weight:600}
.today{color:var(--warn);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:15px;margin:18px 0 8px}
h3{font-size:13px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.strip{display:grid;grid-template-columns:repeat(5,1fr) auto auto;gap:6px;margin-bottom:16px}
.strip button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);position:relative;overflow:hidden}
.strip button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.strip button.on{outline:2px solid var(--c)}
.strip .v{font-size:24px;font-weight:650;line-height:1.1}
.strip .l{font-size:12px;color:var(--muted)}
.strip .r{font-size:11px;color:var(--muted)}
.strip .closed{min-width:130px}
.strip.calls{grid-template-columns:repeat(6,1fr)}
.steps{display:inline-flex;gap:3px;align-items:center}
.steps i{display:block;width:22px;height:6px;border-radius:3px;background:var(--sx)}
.steps i.on{background:var(--c)}
.steps i.half{background:linear-gradient(90deg,var(--c) 50%,var(--sx) 50%)}
.stlabel{font-size:12px;margin-top:3px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:middle}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.col{min-width:230px;width:230px;background:var(--chip);border-radius:10px;padding:8px;flex-shrink:0;border-top:4px solid var(--c)}
.col h4{margin:2px 4px 2px;font-size:13px;display:flex;justify-content:space-between}
.col .ph{font-size:11px;color:var(--muted);margin:0 4px 8px}
.col.drop{outline:2px dashed var(--accent)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab;font-size:13px}
.tile .t{font-weight:600}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--sx);min-width:120px}
.stack span{display:block;height:100%}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .18s;z-index:20;overflow-y:auto;padding:18px}
#drawer.open{transform:none}
.f{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;align-items:center}
.f label{color:var(--muted);font-size:12px}
.log{border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
.log div{margin-bottom:8px}
.bar{height:8px;background:var(--accent);border-radius:4px}
.barrow{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
pre.tpl{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font:13px/1.5 system-ui,sans-serif;margin:6px 0;max-height:440px;overflow:auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin:6px 0}
.flow span.s{background:var(--chip);padding:3px 8px;border-radius:6px}
.hide{display:none!important}
.ds{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ds button{background:var(--panel);border:0;padding:7px 14px;font:inherit;color:var(--muted);cursor:pointer}
.ds button+button{border-left:1px solid var(--line)}
.ds button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.subl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.subl .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.subl .it:last-child{border-bottom:0}
.subl .it:hover{background:var(--hover)}
code{background:var(--chip);padding:0 4px;border-radius:4px;font-size:12px}
@media (max-width:760px){
  main{padding:16px}
  header{padding:10px 16px}
  .f{grid-template-columns:1fr}
  .strip{grid-template-columns:repeat(3,1fr)}
  .strip.calls{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
  <h1>CyberSafely Lead Manager</h1>
  <div class="ds" id="dsSwitch"><button data-ds="principal">Principals</button><button data-ds="overseer">Overseers</button><button data-ds="campaign">Campaigns</button><button data-ds="pta">PTA</button><button data-ds="user">Users</button></div>
  <nav id="nav"></nav>
  <div class="gs"><input id="gs" type="search" placeholder="Search all lists… (name, school, email, phone)" autocomplete="off"><div id="gsr" class="gs-r"></div></div>
  <div class="grow"></div>
  <span class="small muted" id="savedAt"></span>
</header>
<main id="main"></main>
<aside id="drawer"></aside>

<!-- Email templates synced from the vault's Emails/ folder (python3 .claude/scripts/sync-emails.py). Optional: built-in defaults are used if it's missing. -->
<script src="email-templates.js"></script>
<script src="district-boundaries.js"></script>
<script>
"use strict";
/* ---------- pipeline ---------- */
// One lead = one principal = one school. Simplified flow: one email with a forward-ready family message;
// success is measured by sign-ups on the school's code. "We send it for you" is the exception.
const MAIN = ["new","contacted","engaged","live","active"];
const STAGES = [
  {id:"new",      name:"Cold",      desc:"Not contacted yet",                        c:"--s0"},
  {id:"contacted",name:"Contacted", desc:"In the 3-touch sequence",                   c:"--s1"},
  {id:"rejected", name:"Rejected",  desc:"Email bounced or was rejected",             c:"--bad"},
  {id:"engaged",  name:"Engaged",   desc:"Replied, talked, or says they shared it",   c:"--s2"},
  {id:"live",     name:"Live",      desc:"First family sign-ups on the school's code",c:"--s3"},
  {id:"active",   name:"Active",    desc:"Sign-ups at the target level",              c:"--s4"},
  {id:"nurture",  name:"Nurture",   desc:"No reply after 3 touches",                  c:"--sx"},
  {id:"lost",     name:"Declined",  desc:"Said no, or wrong contact",                 c:"--sx"}
];
const STAGE = Object.fromEntries(STAGES.map((s,i)=>[s.id,{...s,i}]));
// List order (lists sort high → low): Rejected sits just below Contacted.
const RANK = id=>id==="rejected"?STAGE.contacted.i-0.5:STAGE[id].i;
const SEQ = ["","Email 1 sent","Call / bump done","Last email sent"];
const ACTS = ["Call: reached","Voicemail","Front office message","Reply received","Says they shared it","Meeting / demo","Note"];
// Call outcomes: Torino's five categories for principals who opened the emails (Oct 7, 2026).
// Each sets the stage and queues the matching follow-up email (sent from Thursday).
const CALLS = {
  interested:{name:"Interested / Ready to move forward",short:"Interested",c:"--ok",  tpl:"f1",next:"Send next steps (F1)",stage:"engaged"},
  info:      {name:"Needs more information",            short:"Needs info", c:"--s1",  tpl:"f2",next:"Answer questions + send summary (F2)",      stage:"engaged"},
  followup:  {name:"Follow-up needed",                  short:"Follow-up",  c:"--warn",tpl:"f2",next:"Send short summary (F2), then call back",   stage:"contacted"},
  not:       {name:"Not interested",                    short:"Not interested",c:"--bad",tpl:"r2",next:"Send polite close (R2)",               stage:"lost"},
  unreach:   {name:"Unable to reach",                   short:"No answer",  c:"--muted",tpl:"f3",next:"Voicemail left → send follow-up email (F3)",stage:"contacted"}
};
const CALL_IDS = Object.keys(CALLS);
const KEY = "cs-outreach-v1";
const TPL_VERSION = 6;

function callPending(l){const c=l.call&&CALLS[l.call.status];return c&&!["live","active"].includes(l.stage)&&!(l.sent||[]).includes(c.tpl)?c:null;}
function nextFor(l){
  const s=l.stage, q=l.seq||0;
  const c=callPending(l); if(c&&s!=="lost")return [c.next,1];
  if(s==="new") return l.type==="pta"?["Send PTA intro (PT1)",0]:l.type==="user"?["Send check-in email (U1)",0]:l.type==="campaign"?["Send a personal follow-up email",0]:["Send first email (E1)",0];
  if(s==="contacted"&&(l.type==="pta"||l.type==="user")) return ["No reply? Send a short personal follow-up",5];
  if(s==="contacted") return q<=1?["Day 4: call. No answer → voicemail + E2",4]:q===2?["Day 10: last email (E3)",4]:["No reply: moves to Nurture",4];
  if(s==="engaged") return l.path==="we"?["We send it: get contacts (R3), send family message",2]:
                    l.shared?["Check sign-ups on the school's code",5]:["Check sign-ups; nudge (G1) if none",8];
  if(s==="live") return (l.sent||[]).includes("g2")?["Monthly update (G3)",20]:["Send thank-you + reminder (G2)",0];
  if(s==="active") return ["Monthly update (G3)",20];
  if(s==="nurture") return ["Re-try with a fresh angle (E3)",30];
  if(s==="rejected") return ["Find a working email, then re-send",null];
  return null;
}
function suggestTpl(l){
  const s=l.stage,q=l.seq||0,sent=l.sent||[];
  const c=callPending(l); if(c)return c.tpl;
  if(s==="new")return l.type==="overseer"?"d1":l.type==="pta"?"pt1":l.type==="user"?"u1":l.type==="campaign"?null:"e1";
  if((l.type==="pta"||l.type==="user")&&s==="contacted")return null;
  if(s==="contacted")return q<=1?"e2":"e3";
  if(s==="engaged")return l.path==="we"?"r3":"g1";
  if(s==="live")return sent.includes("g2")?"g3":"g2";
  if(s==="active")return"g3";
  if(s==="nurture")return"e3";
  if(s==="rejected")return sent[sent.length-1]||(l.type==="overseer"?"d1":"e1");
  return"r2";
}

/* ---------- email templates ---------- */
// to: stage after logging as sent (forward only). seq: outreach touch number. path: sets who sends.
const DEFAULT_TEMPLATES = [
 {id:"d1",phase:"0 · District overseers",name:"D1 · District cold intro (heads-up)",to:"contacted",seq:1,subject:"A free year of CyberSafely.ai for {{district}} families",body:
`Hi {{greeting}},

I'm {{sender}} with CyberSafely.ai. I wanted to give you a quick heads-up about some good news for families in {{district}}.

Through CyberSafely.ai's collaboration with MSBA, every 5th through 9th grade family in Missouri can use CyberSafely.ai free for one full year.

CyberSafely.ai is an app for parents. It alerts them early if their child may be facing something serious online, like bullying, grooming or sextortion, so they can step in before it escalates.

I've reached out to principals in your district so their families can sign up. For schools, there's no contract, no MOU and no cost. We've already written the message for families, and each school has its own sign-up link.

Nothing is needed from you. If you'd like a quick 15-minute walkthrough, just reply with a good day and time (Central time) and I'll call you.

Thank you,
{{sender}}
CyberSafely.ai
{{phone}}
[CyberSafely.ai mailing address]

P.S. If this isn't a fit, reply "no thanks" and I won't follow up.`},
 {id:"e1",phase:"1 · Outreach (3 touches)",name:"E1 · First email + family message (day 0)",to:"contacted",seq:1,subject:"Your {{school}} family message is ready",body:
`Hi {{greeting}},

Following up on Mike Nutter's note: through CyberSafely.ai's collaboration with MSBA, every 5th through 9th grade family at {{school}} gets a free year of CyberSafely.ai.

It's a parent app that flags trouble early, like bullying, grooming or sextortion, so parents can step in before it escalates.

We've already done the work. The message for your families is below, with {{school}}'s sign-up link built in. Forward it to your 5th–9th grade parents in your next email or newsletter, and that's it.

Office stretched thin? Reply with your PTA or parent contact and we'll send it ourselves. Either way, your families get it.

It may be the easiest yes on your desk this week: no contract, no MOU, no cost. Just one forward.

Thank you,
{{sender}}
CyberSafely.ai
{{phone}}
[CyberSafely.ai mailing address]

P.S. Not a fit for {{school}}? Reply "no thanks" and I'll close the loop.

———— Message for {{school}} families (ready to forward) ————

{{parent_email}}`},
 {id:"e2",phase:"1 · Outreach (3 touches)",name:"E2 · After a call attempt (day 4)",to:"contacted",seq:2,subject:"Following up on Torino's message: {{school}}",body:
`Hi {{greeting}},

I'm following up on the message Torino Fitzgerald left you about the free year of CyberSafely.ai for {{school}}'s 5th–9th grade families. I'm {{sender}}, on Torino's team at CyberSafely.ai, and I'm your point of contact for getting this to your parents.

I gave you a call today and left a short voicemail, so here's the 30-second version.

Through our collaboration with MSBA, your families have a free year waiting. No contract, no MOU, no cost. The only step left is getting the word to parents.

The family message is below, with {{school}}'s sign-up link built in. Forward it in your next parent email or newsletter, and that's it.

Swamped? Reply "send it" with your PTA or parent contact, and we'll handle delivery.

{{sender}}
CyberSafely.ai
{{phone}}

P.S. Torino and I are working on {{school}}'s rollout together, so a reply to either of us gets it moving. Not a fit? Reply "no thanks" and I won't follow up.

———— Message for {{school}} families (ready to forward) ————

{{parent_email}}`},
 {id:"e3",phase:"1 · Outreach (3 touches)",name:"E3 · Last email: right person? (day 10)",to:"contacted",seq:3,subject:"Who handles parent emails at {{school}}?",body:
`Hi {{greeting}},

A principal's inbox is a contact sport, so I'll keep this one short.

Who at {{school}} sends news to families? A counselor, assistant principal or PTA lead is perfect. Reply with a name and I'll take it from there, without adding anything to your plate.

Your 5th–9th grade families' free year is still waiting whenever you're ready.

{{sender}}
CyberSafely.ai`},
 {id:"r1",phase:"2 · Replies",name:"R1 · Has questions / wants a call",to:"engaged",subject:"Re: Your {{school}} family message is ready",body:
`Hi {{greeting}},

Glad you asked. Ten minutes on the phone will cover it. Do any of these work (Central time)?

- [Day, time]
- [Day, time]
- [Day, time]

If none fit, send me a time and the best number, and I'll call you then.

Meanwhile, the family message from my first email is ready to go whenever you are.

{{sender}}
CyberSafely.ai`},
 {id:"r2",phase:"2 · Replies",name:"R2 · Not interested",to:"lost",subject:"Re: Your {{school}} family message is ready",body:
`Hi {{greeting}},

Understood, and thanks for the quick answer. I won't follow up again.

If things change, or a parent asks you about online safety down the road, just reply here and I'll pick it right back up.

Best,
{{sender}}
CyberSafely.ai`},
 {id:"r3",phase:"2 · Replies",name:"R3 · Exception: we send it for you",to:"engaged",path:"we",subject:"Re: Your {{school}} family message is ready",body:
`Hi {{greeting}},

Done. We'll handle delivery. Here's all I need from your office:

1. Parent or PTA email addresses for your 5th–9th grade families. A spreadsheet with one column of emails is plenty.
2. Your OK on the family message from my first email. It goes out as a message from {{school}}.
3. A send date, if you have one in mind. If not, we'll send it within [X] school days.

[Line on how the contacts are used and stored. Get the approved wording from Torino before sending.]

Once it's out, I'll let you know it landed.

{{sender}}
CyberSafely.ai`},
 {id:"g1",phase:"3 · Sign-up support",name:"G1 · No sign-ups yet (nudge)",to:null,subject:"{{school}}: a 50-word version for parents",body:
`Hi {{greeting}},

Thanks again for sharing CyberSafely.ai with your families. Sign-ups from {{school}} haven't come through yet. Inboxes being what they are, the first message may have been buried.

Here's a 50-word version that fits a newsletter, morning announcement or text to parents:

{{newsletter}}

Or reply with your PTA or parent contact and we'll send it ourselves.

{{sender}}
CyberSafely.ai`},
 {id:"g2",phase:"3 · Sign-up support",name:"G2 · First sign-ups: thank-you + reminder",to:null,subject:"{{signups}} {{school}} families are in",body:
`Hi {{greeting}},

Good news: {{signups}} {{school}} families have signed up for CyberSafely.ai. Thank you for making that happen.

A second reminder can catch the families who missed the first one. Here's a short version for your newsletter, announcements or a text to parents:

{{newsletter}}

Parents who want a hand getting set up can join a free live onboarding call: {{onboarding_page}}

{{sender}}
CyberSafely.ai`},
 {id:"g3",phase:"3 · Sign-up support",name:"G3 · Monthly update",to:null,subject:"{{school}}: {{signups}} families and counting",body:
`Hi {{greeting}},

Your monthly update: {{signups}} {{school}} families have signed up so far.

Got a newsletter, parent night or conference coming up? This blurb is ready to drop in:

{{newsletter}}

And if parents have asked you anything about it, send it my way. I'd rather answer a question than let it stall a sign-up.

{{sender}}
CyberSafely.ai`},
 {id:"p1",phase:"Family-facing (inserted above)",name:"P1 · Family message (forwarded by the school)",to:null,subject:"Free for {{school}} families: a year of CyberSafely.ai",body:
`Dear {{school}} families,

We want every 5th–9th grade family at {{school}} to know about a free resource now available to you.

CyberSafely.ai is a parent app that alerts you early if something concerning comes up in your child's online life, like bullying, grooming, sextortion or exposure to harmful content, so you can step in before it escalates.

It's built to support your judgment, not replace it. It doesn't read your child's private messages or store their passwords. It watches for warning signs and lets you know.

Thanks to a collaboration between CyberSafely.ai and MSBA, Missouri families of 5th–9th graders get one full year free.

Getting started takes a few minutes:
1. Sign up here: {{signup_link}}
2. Add your child.

That's it.

Want a hand? Step-by-step instructions, a short video and free live onboarding calls are here: {{onboarding_page}}

Questions? Reach the CyberSafely.ai team at {{support}}.`},
 {id:"n1",phase:"Family-facing (inserted above)",name:"N1 · Newsletter blurb (~50 words)",to:null,subject:"",body:

function log(l,type,note){(l.activity=l.activity||[]).push({ts:nowTs(),type,note:note||""}); l.updatedAt=new Date().toISOString();}
function fwd(l,st){return MAIN.indexOf(st)>MAIN.indexOf(l.stage)||l.stage==="nurture";}

  if(t?.path)l.path=t.path;

  if(t?.to&&fwd(l,t.to))return setStage(l,t.to,t.name);

  if(!st){
    // Clear: drop the outcome and put the stage back to where it was before the first outcome
    if(l.call){const p=l.call.prev; delete l.call.status; delete l.call.ts; delete l.call.by; delete l.call.prev;
      if(p){l.stage=p.stage; l.seq=p.seq||0;}
      log(l,"Note","Call outcome cleared"); setNext(l);}
    return;}
  const c=CALLS[st]; if(!c)return;
  const prev=l.call?.prev||{stage:l.stage,seq:l.seq||0};
  l.call={...(l.call||{}),status:st,ts:nowTs(),by:S.settings.caller||"",prev};
  log(l,"Call",c.name+(st==="unreach"?" (voicemail)":"")+(note?": "+note:""));
  if(c.stage==="lost")setStage(l,"lost",c.name);
  else if(c.stage==="engaged"&&fwd(l,"engaged"))setStage(l,"engaged",c.name);
  else if(c.stage==="contacted"&&["new","lost","nurture"].includes(l.stage))setStage(l,"contacted",c.name);
  if(c.stage==="contacted")l.seq=Math.max(l.seq||0,2);
  setNext(l);
}
// Start over: put the pipeline back to a fresh Cold lead. Contact details and notes stay.
function resetLead(l){
  l.stage="new"; l.seq=0; l.sent=[]; l.activity=[]; l.families={}; l.path=""; l.shared=false;
  delete l.call;
  setNext(l); l.updatedAt=new Date().toISOString();
}
// Outreach finished with no reply → Nurture
function tick(){
  const t=todayISO(); let ch=false;
  S.leads.forEach(l=>{if(l.stage==="contacted"&&(l.seq||0)>=3&&l.nextDue&&l.nextDue<t){setStage(l,"nurture","no reply after 3 touches");ch=true;}});

}

  STAGES.map(s=>{const ls=DL().filter(l=>l.stage===s.id);
    return `<div class="col" data-st="${s.id}" style="--c:${cv(s.id)}"><h4><span>${s.name}</span><span class="muted">${ls.length}</span></h4><div class="ph">${esc(s.desc)}</div>`+
    ls.slice(0,150).map(l=>`<div class="tile" draggable="true" data-id="${l.id}"><div class="t">${esc(schoolOf(l))}</div><div class="small muted">${esc(name(l))}${l.stage==="contacted"?` · touch ${l.seq||1}/3`:""}${l.shared?" · shared":""}${l.path==="we"?" · we send":""}${l.families?.signups?` · ${esc(l.families.signups)} sign-ups`:""} ${callChip(l)}</div>${l.nextDue?`<div class="small ${dueClass(l.nextDue)}">${fmtDate(l.nextDue)} · ${esc(l.nextAction)}</div>`:""}</div>`).join("")+
    (ls.length>150?`<div class="small muted">+${ls.length-150} more (use Schools)</div>`:"")+`</div>`;}).join("")+`</div>`;
  bindStrip(m);
  m.querySelectorAll(".tile").forEach(t=>t.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",t.dataset.id)));
  m.querySelectorAll(".col").forEach(c=>{
    c.addEventListener("dragover",e=>{e.preventDefault();c.classList.add("drop");});
    c.addEventListener("dragleave",()=>c.classList.remove("drop"));
    c.addEventListener("drop",e=>{e.preventDefault();c.classList.remove("drop");const l=lead(e.dataTransfer.getData("text/plain"));if(l){setStage(l,c.dataset.st);save();render();}});
  });
}

/* ---------- Map ---------- */
function vMap(m){
  const data=window.MO_DISTRICTS;
  if(!data||!data.features){m.innerHTML=`<div class="card"><h2 style="margin-top:0">Map data not loaded</h2><p><code>district-boundaries.js</code> wasn't found next to this file. It ships the Missouri school-district polygons (source: MO DESE / MSDIS). Reload once it's in the same folder as this HTML.</p></div>`;return;}
  // Count leads per DESE district code and by normalized name.
  const byCode={}, byName={}, nameOf={};
  DL().forEach(l=>{
    if(l.districtId){const k=String(l.districtId).trim();byCode[k]=(byCode[k]||0)+1;if(l.district)nameOf[k]=l.district;}
    const n=normD(l.district); if(n)byName[n]=(byName[n]||0)+1;
  });
  const countFor=f=>{const c=f.properties.code; if(c&&byCode[c]!=null)return byCode[c]; return byName[normD(f.properties.name)]||0;};
  const counts=data.features.map(countFor);
  const max=Math.max(1,...counts);
  // Linear-equirectangular projection, Missouri scale is fine without a real projection.
  const feats=data.features;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const eachRing=(g,fn)=>{if(g.type==="Polygon")g.coordinates.forEach(fn);else if(g.type==="MultiPolygon")g.coordinates.forEach(p=>p.forEach(fn));};
  feats.forEach(f=>eachRing(f.geometry,r=>r.forEach(([x,y])=>{if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;})));
  const W=1000,H=700,pad=10;
  // Latitude correction so Missouri doesn't look squashed.
  const midLat=(minY+maxY)/2, kx=Math.cos(midLat*Math.PI/180);
  const dx=(maxX-minX)*kx, dy=maxY-minY;
  const s=Math.min((W-2*pad)/dx,(H-2*pad)/dy);
  const ox=(W-dx*s)/2, oy=(H-dy*s)/2;
  const px=x=>ox+(x-minX)*kx*s, py=y=>H-oy-(y-minY)*s;
  const ringPath=r=>r.map(([x,y],i)=>(i?"L":"M")+px(x).toFixed(1)+" "+py(y).toFixed(1)).join("")+"Z";
  const geomPath=g=>g.type==="Polygon"?g.coordinates.map(ringPath).join(""):g.coordinates.map(p=>p.map(ringPath).join("")).join("");
  // Heat color: darker = more leads. Use the existing accent blue family.
  const heat=n=>{if(!n)return "var(--sx)"; const t=Math.min(1,n/max); const L=85-t*55; return `hsl(220 70% ${L}%)`;};
  const paths=feats.map((f,i)=>{
    const n=counts[i], p=f.properties;
    return `<path d="${geomPath(f.geometry)}" fill="${heat(n)}" stroke="var(--line)" stroke-width="0.5" data-i="${i}" data-n="${n}"></path>`;
  }).join("");
  const total=counts.reduce((a,b)=>a+b,0), hit=counts.filter(n=>n>0).length;
  m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
    <div><h2 style="margin:0 0 4px">Missouri lead map</h2><div class="small muted">${total} ${ds==="overseer"?"overseers":ds==="campaign"?"campaign contacts":ds==="pta"?"PTA contacts":ds==="user"?"users":"principals"} across ${hit} of ${feats.length} districts · click a district to filter Schools</div></div>
    <div class="row" style="align-items:center;gap:8px"><span class="small muted">fewer</span>
      <svg width="140" height="12" style="display:block"><defs><linearGradient id="mapGrad" x1="0" x2="1"><stop offset="0" stop-color="hsl(220 70% 85%)"/><stop offset="1" stop-color="hsl(220 70% 30%)"/></linearGradient></defs><rect width="140" height="12" rx="2" fill="url(#mapGrad)"/></svg>
      <span class="small muted">more (max ${max})</span></div>
  </div>
  <div style="position:relative;margin-top:12px">
    <svg id="moMap" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:block">${paths}</svg>
    <div id="mapTip" style="position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;z-index:2;white-space:nowrap"></div>
  </div></div>`;
  const svg=$("#moMap"), tip=$("#mapTip");
  svg.addEventListener("mousemove",e=>{
    const t=e.target.closest("path"); if(!t){tip.style.display="none";return;}
    const i=+t.dataset.i, f=feats[i], n=+t.dataset.n;
    const rect=svg.getBoundingClientRect();
    tip.innerHTML=`<b>${esc(f.properties.name)}</b><br><span class="muted">${esc(f.properties.county||"")}${f.properties.county?" County · ":""}code ${esc(f.properties.code||"—")}</span><br>${n} ${n===1?"lead":"leads"}`;
    tip.style.display="block";
    tip.style.left=Math.min(e.clientX-rect.left+12,rect.width-tip.offsetWidth-6)+"px";
    tip.style.top=(e.clientY-rect.top+12)+"px";
  });
  svg.addEventListener("mouseleave",()=>tip.style.display="none");
  svg.addEventListener("click",e=>{
    const t=e.target.closest("path"); if(!t)return;
    const i=+t.dataset.i, f=feats[i], code=f.properties.code;
    // Prefer a district name that exists in the current list so the filter matches.
    let name=null;
    if(code){const l=DL().find(x=>String(x.districtId||"").trim()===code); if(l&&l.district)name=l.district;}
    if(!name){const nd=normD(f.properties.name); const l=DL().find(x=>normD(x.district)===nd); if(l&&l.district)name=l.district;}
    if(!name)name=f.properties.name;
    filt.district=name; view="leads"; render();
  });
}

function rptBody(o){
  const {from,to}=o, t0=todayISO();
  const span=(a,b)=>ts=>{if(!ts)return false;const t=new Date(ts);return t>=a&&t<=b;};
  const inP=span(from,to), ever=span(new Date(0),to);
  const of=(l,types)=>(l.activity||[]).filter(a=>types.includes(a.type));
  const first=arr=>arr.map(a=>a.ts).sort()[0];
  const stageTo=a=>{const x=/→ ([^:]+)/.exec(a.note||"");const s=x&&STAGES.find(s=>s.name===x[1].trim());return s?s.id:null;};
  // Per-list activity in a time window
  const per=(L,win)=>{const r={n:L.length,emails:0,emailed:0,newEmailed:0,calls:0,called:0,newCalled:0,talks:0,bounced:0,added:0,enter:{}};
    L.forEach(l=>{
      const em=of(l,["Email sent"]),cl=of(l,CALL_ACTS),emP=em.filter(a=>win(a.ts)),clP=cl.filter(a=>win(a.ts));
      r.emails+=emP.length; if(emP.length){r.emailed++; if(win(first(em)))r.newEmailed++;}
      r.calls+=clP.length; if(clP.length){r.called++; if(win(first(cl)))r.newCalled++;}
      (l.activity||[]).filter(a=>win(a.ts)).forEach(a=>{
        if(TALK_ACTS.includes(a.type)||(a.type==="Call"&&!String(a.note).startsWith(CALLS.unreach.name)))r.talks++;
        if(a.type==="Email rejected")r.bounced++;
        if(a.type==="Stage"){const s=stageTo(a);if(s)r.enter[s]=(r.enter[s]||0)+1;}});
      if(win(l.createdAt))r.added++;});
    return r;};
  const lists=LISTS.map(([id,label])=>{const L=S.leads.filter(l=>(l.type||"principal")===id);return {id,label,L,p:per(L,inP)};}).filter(x=>x.L.length);
  const sum=k=>lists.reduce((a,x)=>a+x.p[k],0), ent=s=>lists.reduce((a,x)=>a+(x.p.enter[s]||0),0);
  const toDate=per(S.leads,ever);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"not yet measurable";
  const N=v=>Number(v).toLocaleString();

  // Principals: pipeline snapshot and onboarding
  const P=S.leads.filter(isPr), pp=per(P,inP);
  const cnt=s=>P.filter(l=>l.stage===s).length, reach=s=>P.filter(l=>MAIN.indexOf(l.stage)>=MAIN.indexOf(s)).length;
  const contacted=P.filter(l=>l.stage!=="new").length;
  const eng=P.filter(l=>l.stage==="engaged"), obTotal=eng.length+cnt("live")+cnt("active");
  const fam=k=>{const v=P.map(l=>l.families?.[k]).filter(x=>x!==undefined&&x!==null&&x!=="");return v.length?{sum:v.reduce((a,b)=>a+ +b,0),n:v.length}:null;};
  const sg=fam("signups"), ac=fam("activated");
  const pending=P.filter(l=>l.stage!=="lost"&&callPending(l)).length;

  // Districts in focus: the ones named in "focus", then the most-touched this period
  const focus=String(o.focus||"").toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const dRows=[...new Set(P.map(l=>l.district||"(none)"))].map(d=>{const L=P.filter(l=>(l.district||"(none)")===d),r=per(L,inP);
    return {d,n:L.length,emails:r.emails,calls:r.calls,touch:r.emails+r.calls,cont:L.filter(l=>l.stage!=="new").length,
      eng:L.filter(l=>MAIN.indexOf(l.stage)>=2).length,su:L.reduce((a,l)=>a+(+l.families?.signups||0),0),f:focus.some(f=>d.toLowerCase().includes(f))};});
  const topD=dRows.filter(x=>x.f||x.touch).sort((a,b)=>(b.f-a.f)||(b.touch-a.touch)||(b.eng-a.eng)).slice(0,8);
  const regs=[...new Set(P.map(l=>l.region).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  const rRows=regs.map(g=>{const L=P.filter(l=>l.region===g),r=per(L,inP);
    return {g,n:L.length,cont:L.filter(l=>l.stage!=="new").length,eng:L.filter(l=>MAIN.indexOf(l.stage)>=2).length,touch:r.emails+r.calls,f:focus.some(f=>("region "+g).toLowerCase()===f||String(g).toLowerCase()===f)};});

  // Calls by outcome (this period vs where every contact stands now)
  const callP=k=>S.leads.reduce((a,l)=>a+of(l,["Call"]).filter(x=>inP(x.ts)&&String(x.note).startsWith(CALLS[k].name)).length,0);
  const callNow=k=>S.leads.filter(l=>l.call?.status===k).length;

  // Last 10 workdays: emails and calls per day (local dates)
  const days=[];{const d=new Date();while(days.length<10){const w=d.getDay();if(w&&w<6)days.unshift(iso(d));d.setDate(d.getDate()-1);}}
  const per10=Object.fromEntries(days.map(d=>[d,{e:0,c:0}]));

  const mx=Math.max(1,...days.map(d=>per10[d].e+per10[d].c));

function lev(a,b){const m=a.length,n=b.length,d=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}}return d[n];}
function applyActivityLog(text){
  const rows=parseCsv(text.replace(/^\uFEFF/,"")); if(rows.length<2)return "No rows found.";
  const H=rows[0].map(h=>h.trim().toLowerCase()), ix=k=>H.indexOf(k);
  if(ix("action")<0||(ix("name")<0&&ix("email")<0))return "Need an Action column and a Name or Email column.";
  const pool=DL(), nn=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
  const find=(nm,em)=>{
    if(em){const e=pool.find(l=>(l.email||"").toLowerCase()===em.toLowerCase());if(e)return e;}
    if(!nm)return null; const k=nn(nm);
    const exact=pool.filter(l=>nn(name(l))===k); if(exact.length===1)return exact[0];
    const near=pool.map(l=>[l,lev(nn(name(l)),k)]).filter(x=>x[1]<=2).sort((a,b)=>a[1]-b[1]);
    return near.length&&(near.length===1||near[0][1]<near[1][1])?near[0][0]:null;};
  const recs=rows.slice(1).map(r=>{const g=k=>ix(k)>=0?(r[ix(k)]||"").trim():"";return {nm:g("name"),em:g("email"),act:g("action").toLowerCase(),date:g("date"),note:g("note")};}).filter(x=>x.act);
  const named=new Set(), missing=[];
  recs.forEach(x=>{if(x.nm==="*")return; x.l=find(x.nm,x.em); if(x.l)named.add(x.l.id); else missing.push(x.nm||x.em);});
  let done=0, skipped=0; const bad=new Set(), touched=new Set();
  const apply=(l,x)=>{
    const t=x.act==="voicemail"?null:tpl(x.act); if(x.act!=="voicemail"&&!t){bad.add(x.act);return;}
    const type=t?"Email sent":"Call", nm=t?t.name:CALLS.unreach.name;
    if((l.activity||[]).some(a=>a.type===type&&(t?a.note===nm:a.note.startsWith(nm))&&a.ts.slice(0,10)===x.date)){skipped++;return;}
    BASE=/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:null;
    try{ if(t)logSent(l,t.id); else setCall(l,"unreach",x.note); } finally{BASE=null;}
    done++; touched.add(l.id);};
  recs.forEach(x=>{ if(x.nm==="*")pool.filter(l=>!named.has(l.id)).forEach(l=>apply(l,x)); else if(x.l)apply(x.l,x); });
  save();
  return `Logged ${done} actions for ${touched.size} ${W().many}.`+(skipped?` Skipped ${skipped} already logged.`:"")+
    (missing.length?`<div class="over">No match for: ${[...new Set(missing)].map(esc).join(", ")}. Check the spelling against the Schools list.</div>`:"")+
    (bad.size?`<div class="over">Unknown email IDs: ${[...bad].map(esc).join(", ")}.</div>`:"");
}
function parseCsv(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===","){r.push(f);f="";} else if(c==="\n"){r.push(f);rows.push(r);r=[];f="";} else if(c!=="\r")f+=c;}
  if(f||r.length){r.push(f);rows.push(r);} return rows.filter(x=>x.some(v=>v.trim()));
}
function importCsv(text,camp){
  let rows=parseCsv(text.replace(/^﻿/,""));
  // Skip a title line above the header (e.g. "PTA DATASET,")
  const hi=rows.slice(0,5).findIndex(r=>r.some(c=>/^(e-?mail|name|full name|first ?name|record id|contact id)$/i.test(c.trim())));
  if(hi>0)rows=rows.slice(hi);
  if(rows.length<2)return "No rows found.";
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{for(const n of names){const i=H.indexOf(n);if(i>=0)return i;}for(const n of names){const i=H.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
  const ex=(...names)=>{for(const n of names){const i=H.indexOf(n);if(i>=0)return i;}return -1;};
  const C={hubspotId:col("record id","contact id","hs_object_id"),first:col("first name","firstname"),last:col("last name","lastname"),email:col("email"),
    phone:col("phone number","phone"),jobtitle:col("job title","jobtitle"),school:col("school"),
    // "Company" in HubSpot exports is MSBA (the list source), so the associated company wins
    districtId:col("district id","districtid"),
    district:[(()=>{const i=H.indexOf("district");return i>=0?i:H.findIndex(h=>h.includes("district")&&!h.includes("id"));})(),col("associated company"),col("primary company"),col("company name"),col("company")].find(i=>i>=0)??-1,owner:col("contact owner","owner"),notes:col("notes"),
    full:(()=>{const i=H.indexOf("name");return i>=0?i:H.indexOf("full name");})(),state:col("state/region","state"),
    // From the cleaned Notion school list (exact header match only, so HubSpot's "State/Region" isn't read as Region)
    code:ex("referral code","promo code"),regLink:ex("sign-up link","signup link","registration link"),
    level:ex("level"),grades:ex("grades"),city:ex("city"),region:ex("region"),assigned:ex("assigned")};
  if(C.email<0&&C.first<0&&C.full<0)return "Couldn't find Email or First Name columns. Check the export.";
  let add=0,upd=0,skip=0;
  const low=s=>(s||"").toLowerCase();
  for(const r of rows.slice(1)){
    const g=k=>C[k]>=0?(r[C[k]]||"").trim():"";
    const rec={hubspotId:g("hubspotId"),first:g("first"),last:g("last"),email:g("email").toLowerCase(),phone:g("phone"),jobtitle:g("jobtitle"),school:g("school"),district:g("district"),owner:g("owner"),notes:g("notes"),districtId:g("districtId"),state:g("state"),
      code:g("code"),regLink:g("regLink"),level:g("level"),grades:g("grades"),city:g("city"),region:g("region"),assigned:g("assigned")};
    // PTA and Users: an organization name ("Woodbury PTO") goes in school; a name that's just the email is dropped
    if((ds==="pta"||ds==="user")&&!rec.first&&!rec.last&&g("full")){const f=g("full");
      if(f.includes("@")||f.toLowerCase()===rec.email);else if(/\b(pta|pto|ptsa|ptc|ptg|ptso|association|council|school|office|board|parents?|foundation|booster)s?\b/i.test(f)){if(!rec.school)rec.school=f;}
      else{const p=f.split(/\s+/);rec.first=p.shift();rec.last=p.join(" ");}}
    if(!rec.first&&!rec.last&&ds!=="pta"&&ds!=="user"&&g("full")){const p=g("full").split(/\s+/);rec.first=p.shift();rec.last=p.join(" ");}
    if(/#VALUE!/.test(rec.first+rec.last)){rec.first="";rec.last="";rec.notes=rec.notes||"⚠️ Name was #VALUE! in HubSpot. Fix the record there.";}
    if(!rec.email&&!rec.first&&!rec.last){skip++;continue;}
    const pool=DL();
    const ex=pool.find(l=>(rec.hubspotId&&l.hubspotId===rec.hubspotId)||(rec.email&&l.email===rec.email))
      ||(rec.first&&pool.find(l=>low(l.first)===low(rec.first)&&low(l.last)===low(rec.last)&&low(l.district)===low(rec.district)));
    if(camp)rec.campaign=ex?[...new Set([...campsOf(ex),camp])].join(", "):camp;
    if(ex){for(const k of Object.keys(rec))if(rec[k]&&k!=="notes")ex[k]=rec[k]; if(rec.notes&&!ex.notes)ex.notes=rec.notes; upd++;}
    else{const l={id:uid(),...rec,...(ds!=="principal"?{type:ds}:{}),stage:"new",seq:0,sent:[],path:"",activity:[],families:{},createdAt:new Date().toISOString()};setNext(l);S.leads.push(l);add++;}
  }
  save();
  const P=DL(), unowned=P.filter(l=>!l.owner).length, noEmail=P.filter(l=>!l.email).length, noSchool=ds!=="principal"?0:P.filter(l=>!l.school).length;
  return `Added ${add}, updated ${upd}, skipped ${skip} empty rows.`+(unowned?` ${unowned} have no HubSpot owner.`:"")+(noEmail?` ${noEmail} have no email.`:"")+
    (noSchool?` ${noSchool} have no school name (only the district). Emails will say the district until you add it.`:"");
}
function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function toCsv(){
  const h=["Record ID","Email","Phone Number","First Name","Last Name","Job Title","School","District","HubSpot Owner","Stage","Outreach Touches","Shared With Families","Who Sends","Next Step","Next Due","Touches","Last Touch","Referral Code","Sign-up Link","Parent Signups","Activated","Counts As Of","Call Outcome","Call Date","Caller","Call Note","Wants Fundraising Info","Campaigns","State","District ID"];
  return [h,...DL().map(l=>[l.hubspotId,l.email,fmtPhone(l.phone),l.first,l.last,l.jobtitle,l.school,l.district,l.owner,STAGE[l.stage].name,l.seq||0,l.shared?"yes":"",l.path==="we"?"We send":"School forwards",l.nextAction,l.nextDue,touches(l),lastTouch(l),l.code,l.regLink,l.families?.signups,l.families?.activated,l.families?.asOf,CALLS[l.call?.status]?.name||"",l.call?.status&&l.call.ts?l.call.ts.slice(0,10):"",l.call?.by||"",l.call?.note||"",l.call?.fundraising?"yes":"",l.campaign||"",l.state||"",l.districtId||""])].map(r=>r.map(csvCell).join(",")).join("\n");
}
function aggCsv(){
  const ds=[...new Set(DL().map(l=>l.district||"(none)"))].sort();
  const h=["District","Schools",...STAGES.map(s=>s.name),"Parent signups","Activated"];
  const rows=ds.map(d=>{const L=DL().filter(l=>(l.district||"(none)")===d);const sum=k=>{const v=L.map(l=>l.families?.[k]).filter(x=>x!==undefined&&x!=="");return v.length?v.reduce((a,b)=>a+ +b,0):"not yet measurable";};
    return [d,L.length,...STAGES.map(s=>L.filter(l=>l.stage===s.id).length),sum("signups"),sum("activated")];});
  return [h,...rows].map(r=>r.map(csvCell).join(",")).join("\n");
}
function dl(name,content,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* ---------- Process ---------- */

  <h3>Outreach: 3 touches, then Nurture</h3>

  <li>"No thanks" is final.</li>

/* ---------- global search ---------- */
function gsSearch(q){
  q=q.trim().toLowerCase(); if(!q)return [];
  const qd=q.replace(/\D/g,"");
  return S.leads.filter(l=>{
    const hay=[name(l),l.school,l.district,l.email,l.notes,l.city,l.campaign,l.jobtitle,l.assigned].filter(Boolean).join(" ").toLowerCase();
    if(hay.includes(q))return true;
    if(qd&&qd.length>=3&&digits(l.phone).includes(qd))return true;
    return false;
  }).slice(0,20);
}
function gsRender(items,sel){
  const r=$("#gsr");
  if(!items.length){r.innerHTML=`<div class="gs-empty">No matches.</div>`;r.classList.add("open");return;}
  r.innerHTML=items.map((l,i)=>{
    const t=l.type||"principal";
    const line2=[schoolOf(l),l.district&&l.district!==l.school?l.district:""].filter(Boolean).join(" · ");
    const line3=[l.email,l.phone].filter(Boolean).join(" · ");
    return `<button data-id="${l.id}" data-ds="${t}" class="${i===sel?"sel":""}"><div><b>${esc(name(l))}</b> <span class="gs-badge">${t}</span></div>${line2?`<div class="small muted">${esc(line2)}</div>`:""}${line3?`<div class="small">${esc(line3)}</div>`:""}</button>`;
  }).join("");
  r.classList.add("open");
}
function gsJump(id,targetDs){
  if(targetDs!==ds){setDs(targetDs);document.querySelectorAll("#dsSwitch button").forEach(b=>b.classList.toggle("on",b.dataset.ds===ds));}
  view="leads"; render(); openLead(id);
  $("#gs").value=""; $("#gsr").classList.remove("open");
}
(function(){
  let sel=0, items=[];
  const inp=$("#gs"), r=$("#gsr");
  inp.addEventListener("input",()=>{items=gsSearch(inp.value);sel=0;if(!inp.value.trim()){r.classList.remove("open");return;}gsRender(items,sel);});
  inp.addEventListener("focus",()=>{if(inp.value.trim()){items=gsSearch(inp.value);gsRender(items,sel);}});
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();if(items.length){sel=(sel+1)%items.length;gsRender(items,sel);}}
    else if(e.key==="ArrowUp"){e.preventDefault();if(items.length){sel=(sel-1+items.length)%items.length;gsRender(items,sel);}}
    else if(e.key==="Enter"){const it=items[sel];if(it){e.preventDefault();gsJump(it.id,it.type||"principal");}}
    else if(e.key==="Escape"){r.classList.remove("open");inp.blur();}
  });
  r.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)gsJump(b.dataset.id,b.dataset.ds);});
  document.addEventListener("click",e=>{if(!e.target.closest(".gs"))r.classList.remove("open");});
})();

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("open"))closeDrawer();});
tick(); render();
if(S.savedAt)$("#savedAt").textContent="Last saved "+new Date(S.savedAt).toLocaleString();
</script>
